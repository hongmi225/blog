<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>관리자 — 댓글 관리</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />

<style>
  :root{
    --bg: #FFFFFF;
    --card: #FAFAFA;
    --ink: #111111;
    --ink-soft: #5C5C5C;
    --accent: #FFE45C;
    --line: #E5E3D8;
    --danger: #B3261E;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 100px; }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 { font-size: 24px; margin: 0 0 24px; }

  /* ---------- 로그인 화면 ---------- */

  #login-view { max-width: 340px; margin: 60px auto 0; }

  #login-view .field { margin-bottom: 14px; }
  #login-view label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }

  input[type="email"], input[type="password"] {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--ink);
  }

  input:focus { outline: none; border-color: var(--ink); }

  .login-btn {
    width: 100%;
    font-size: 14px;
    font-weight: 500;
    padding: 12px;
    border: none;
    border-radius: var(--radius);
    background: var(--ink);
    color: var(--accent);
    cursor: pointer;
    margin-top: 6px;
  }

  .login-error {
    font-size: 12.5px;
    color: var(--danger);
    margin-top: 10px;
    display: none;
  }

  /* ---------- 관리 화면 ---------- */

  #admin-view { display: none; }

  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .logout-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .logout-btn:hover { border-color: var(--ink); }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; }

  .tab-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
  }

  .tab-btn.active { background: var(--ink); border-color: var(--ink); color: var(--accent); }

  .comment-row {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
  }

  .comment-row-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 8px;
  }

  .comment-meta-left { font-size: 13px; }
  .comment-meta-left .name { font-weight: 600; }
  .comment-meta-left .post-title {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .comment-meta-left .date {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .delete-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--danger);
    border-radius: 8px;
    background: #fff;
    color: var(--danger);
    cursor: pointer;
    white-space: nowrap;
  }

  .delete-btn:hover { background: var(--danger); color: #fff; }
  .delete-btn:disabled { opacity: 0.5; cursor: default; }

  .comment-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .empty-msg, .loading-msg {
    font-size: 13.5px;
    color: var(--ink-soft);
    padding: 40px 0;
    text-align: center;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="eyebrow">관리자</div>

  <div id="login-view">
    <h1>로그인</h1>
    <div class="field">
      <label for="login-email">이메일</label>
      <input type="email" id="login-email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="login-password">비밀번호</label>
      <input type="password" id="login-password" autocomplete="current-password" />
    </div>
    <button class="login-btn" id="login-btn">로그인</button>
    <div class="login-error" id="login-error"></div>
  </div>

  <div id="admin-view">
    <div class="admin-header">
      <h1 style="margin:0;">댓글 관리</h1>
      <button class="logout-btn" id="logout-btn">로그아웃</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-filter="all">전체</button>
    </div>

    <div id="comment-admin-list"><div class="loading-msg">불러오는 중...</div></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="posts.js"></script>
<script>
(function () {
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const loginView = document.getElementById('login-view');
  const adminView = document.getElementById('admin-view');
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const loginError = document.getElementById('login-error');
  const listEl = document.getElementById('comment-admin-list');

  function postTitle(postId) {
    const p = (typeof POSTS !== 'undefined') ? POSTS.find(p => p.id === postId) : null;
    return p ? p.title : postId;
  }

  function formatDate(ts) {
    if (!ts || !ts.toDate) return '';
    return ts.toDate().toLocaleString('ko-KR');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  async function loadComments() {
    listEl.innerHTML = '<div class="loading-msg">불러오는 중...</div>';
    try {
      const snap = await db.collection('comments').orderBy('createdAt', 'desc').get();
      if (snap.empty) {
        listEl.innerHTML = '<div class="empty-msg">등록된 댓글이 없습니다.</div>';
        return;
      }
      listEl.innerHTML = snap.docs.map(doc => {
        const c = doc.data();
        return `
          <div class="comment-row" data-id="${doc.id}">
            <div class="comment-row-top">
              <div class="comment-meta-left">
                <span class="name">${escapeHtml(c.name || '익명')}</span>
                <span class="post-title">${escapeHtml(postTitle(c.postId))}</span>
                <span class="date">${formatDate(c.createdAt)}</span>
              </div>
              <button class="delete-btn" data-id="${doc.id}">삭제</button>
            </div>
            <div class="comment-text">${escapeHtml(c.text)}</div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('이 댓글을 삭제할까요? 되돌릴 수 없습니다.')) return;
          btn.disabled = true;
          btn.textContent = '삭제 중...';
          try {
            await db.collection('comments').doc(btn.dataset.id).delete();
            document.querySelector(`.comment-row[data-id="${btn.dataset.id}"]`).remove();
          } catch (e) {
            alert('삭제 실패: 로그인이 만료되었거나 권한이 없습니다.');
            btn.disabled = false;
            btn.textContent = '삭제';
          }
        });
      });
    } catch (e) {
      listEl.innerHTML = '<div class="empty-msg">불러오기에 실패했습니다.</div>';
      console.error(e);
    }
  }

  loginBtn.addEventListener('click', async () => {
    loginError.style.display = 'none';
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) {
      loginError.textContent = '이메일과 비밀번호를 입력해주세요.';
      loginError.style.display = 'block';
      return;
    }
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (e) {
      loginError.textContent = '로그인에 실패했습니다. 이메일·비밀번호를 확인해주세요.';
      loginError.style.display = 'block';
    }
  });

  logoutBtn.addEventListener('click', () => auth.signOut());

  auth.onAuthStateChanged(user => {
    if (user) {
      loginView.style.display = 'none';
      adminView.style.display = 'block';
      loadComments();
    } else {
      loginView.style.display = 'block';
      adminView.style.display = 'none';
    }
  });
})();
</script>

</body>
</html>
